name: Sync Rules and Generate V1 Compat

on:
  schedule:
    - cron: '30 9 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:
  push:
    branches:
      - sing-box-v1-compat
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write # 赋予 Actions 写入和推送代码到你仓库的权限

jobs:
  sync-and-convert:
    runs-on: ubuntu-latest

    steps:
      # 第一步：克隆你自己的仓库到 Actions 运行环境中
      - name: Checkout own repository
        uses: actions/checkout@v4
        with:
          ref: sing # 签出你的目标同步基础分支
          fetch-depth: 0 # 获取完整历史记录

      # 第二步：将官方仓库添加为远程源，拉取最新代码并强制覆盖本地的原版文件
      - name: Fetch and Sync from MetaCubeX official
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 添加官方源并拉取
          git remote add upstream https://github.com/MetaCubeX/meta-rules-dat.git
          git fetch upstream sing

          # 强制将当前工作区和代码树对齐到官方的最新 sing 分支
          git reset --hard upstream/sing

      # 第三步：【关键修复】从你自己的远程 sing 分支把 Python 脚本单独“捞”回来
      - name: Restore Python Script from origin
        run: |
          # 从你自己的 origin/sing 分支中单独把脚本文件检出到当前工作区
          git checkout origin/master -- resources/generate_sing_box_v1_rules.py
          echo "✅ 成功从 origin/master 恢复脚本文件！"

      # 第四步：设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第五步：运行你的 V1 规则生成脚本
      - name: Generate V1 JSON Rules
        run: |
          python resources/generate_sing_box_v1_rules.py

      - name: Install sing-box 1.9.4 CLI
        run: |
          echo "📥 正在下载 sing-box 1.9.4 官方内核..."
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.4/sing-box-1.9.4-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          # 将解压出来的 1.9.4 sing-box 执行文件移动到当前根目录并赋予执行权限
          mv sing-box-1.9.4-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          echo "✅ sing-box 1.9.4 准备就绪："
          ./sing-box version

      # 第七步：【核心新增】利用 1.9.4 内核，将所有新生成的 .v1.json 转换为 V1 二进制 .srs
      - name: Compile V1 JSON to SRS
        run: |
          echo "🚀 开始批量编译 V1 SRS 二进制文件..."
          # 循环查找所有生成的 .v1.json 文件
          find asn geo geo-lite -name "*.v1.json" | while read -r json_file; do
            # 构造输出的 srs 文件路径，例如：cn.v1.json -> cn.v1.srs
            srs_file="${json_file%.json}.srs"
            # 使用 1.9.4 内核执行编译命令
            ./sing-box rule-set compile --output "$srs_file" "$json_file"
            # 编译完成后，为了保持仓库绝对纯净并减小体积，把临时的 .v1.json 删掉
            # rm -f "$json_file"
          done
          # echo "✅ 批量编译完成，临时 JSON 已清理！"

      # 第八步：将变动（包含同步过来的官方新代码和新生成的 .v1.json）推送到你的专属兼容分支
      - name: Push to sing-box-v1-compat branch
        run: |
          # 切换到一个干净的、以当前状态为准的 sing-box-v1-compat 分支
          # 如果该分支在远程已存在，它会覆盖；如果不存在，它会创建
          git checkout -b sing-box-v1-compat

          # 清理 Actions 运行时产生的内核工具文件，防止它们被推送到分支
          rm -f sing-box sing-box.tar.gz
          rm -rf sing-box-*-linux-amd64

          # 【核心大扫除】将当前工作区在 Git 里的所有追踪记录全部清空（相当于全盘暂存区删除）
          git rm -rf .

          # 只 push *.v1.* 老版本文件
          git add '**/*.v1.*'

          # 检查是否有剩余的文件发生变化（即只有同步过来的规则和新生成的 .v1.json 文件）
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: 自动同步 MetaCubeX 官方更新并生成 v1 兼容规则集"
            # 使用 --force 强制推送到你指定的专属分支
            git push origin sing-box-v1-compat --force
            echo "✅ 成功同步并强制推送至 sing-box-v1-compat 分支！"
          else
            echo "✨ 没有检测到任何文件变动，无需推送。"
          fi
